.brand-fallback{font-weight:900;font-size:19px;letter-spacing:-1px;color:#fff}
.brand-card h3{font-size:13px}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-5px 0 20px}
.filter-chip{border:1px solid #39445d;background:#121827;color:#dce2f0;border-radius:999px;padding:8px 14px;cursor:pointer}
.filter-chip.active{background:#8b5cf6;border-color:#8b5cf6;color:white}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.product-card{background:#121827;border:1px solid #293248;border-radius:15px;overflow:hidden;cursor:pointer;transition:.2s}
.product-card:hover{transform:translateY(-4px);border-color:#8b5cf6}
.product-image{height:180px;background:linear-gradient(145deg,#26314b,#101626);display:flex;justify-content:center;align-items:center;padding:12px}

.placeholder{text-align:center;color:#c4b5fd;padding:10px}
.phone-icon{font-size:48px;display:block;margin-bottom:5px}
.placeholder small{display:block;color:#aab4c8;font-size:11px}
.product-info{padding:14px}.product-info h3{font-size:16px;margin-bottom:5px}
.storage{color:#aab4c8;font-size:13px;margin-bottom:8px}
.price{color:#c4b5fd;font-size:20px;font-weight:bold;margin-bottom:8px}
.condition{display:inline-block;background:#292447;color:#ddd4ff;padding:4px 8px;border-radius:5px;font-size:11px;margin-bottom:12px}
.details-button{width:100%;padding:11px;border:none;border-radius:8px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer;font-size:14px}
.details-button:hover{background:#7544e8}
.empty-message{grid-column:1/-1;text-align:center;color:#aab4c8;padding:30px}
#detailsPage{display:none;max-width:1100px;margin:auto;padding:25px 5% 45px;min-height:60vh}
.back-button{background:#20283a;border:1px solid #39445d;color:white;padding:10px 16px;border-radius:8px;margin-bottom:22px;cursor:pointer}
.details-layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.details-image{min-height:340px;background:linear-gradient(145deg,#26314b,#101626);border:1px solid #293248;border-radius:16px;display:flex;justify-content:center;align-items:center;padding:20px;overflow:hidden}
.details-image img{width:100%;max-height:420px;object-fit:contain}.details-image .phone-icon{font-size:85px}
.details-info h1{font-size:clamp(26px,4vw,36px);margin-bottom:8px}.details-info .price{font-size:30px;margin:12px 0}
.details-description{color:#aab4c8;margin-bottom:15px}
.spec-heading{font-size:22px;margin:24px 0 12px}.spec-list{list-style:none}

.spec-list li span:first-child{color:#aab4c8}.spec-list li span:last-child{text-align:right;overflow-wrap:anywhere}
.buy-button{display:block;text-align:center;text-decoration:none;background:#25d366;color:#07150b;font-weight:900;padding:15px;border-radius:10px;margin-top:22px}
.buy-button:hover{background:#49e982}
footer{text-align:center;padding:25px 15px;background:#101626;border-top:1px solid #293248;color:#aab4c8;font-size:13px}footer strong{color:white}
@media(max-width:900px){.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){

.brand-grid::-webkit-scrollbar{height:5px}

const products = [

 {id:"vivo-v29",name:"Vivo V29",brand:"Vivo",storage:"8GB / 128GB",price:null,condition:"ASK FOR DETAILS",image:"",specs:[["RAM / Storage","8GB / 128GB"],["Condition","Confirm with shop"],["Battery","Confirm with shop"],["Camera","Confirm with shop"],["Display","Confirm with shop"]]},

];

let selectedBrand = "all";

function formatPrice(price){
  return price === null || price === undefined ? "Ask for Price" : "₹" + price.toLocaleString("en-IN") + "/-";
}
function imageMarkup(product){
  if(product.image){
    const safeName = product.name.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return `<img src="${product.image}" alt="${safeName}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="placeholder" style="display:none"><span class="phone-icon">📱</span><strong>${safeName}</strong><small>Photo will be added soon</small></div>`;
  }
  return `<div class="placeholder"><span class="phone-icon">📱</span><strong>${product.name}</strong><small>Phone photo will be added soon</small></div>`;
}
function renderBrands(){
  const grid = document.getElementById("brandGrid");
  grid.innerHTML = brands.map(brand => `
    <button class="brand-card" type="button" data-select-brand="${brand.name}" aria-label="Show ${brand.name} phones">
      <span class="brand-logo">
        <img src="${brand.logo}" alt="${brand.name} logo" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="brand-fallback" style="display:none">${brand.fallback}</span>
      </span>
      <h3>${brand.name}</h3>
    </button>
  `).join("");
}
function renderFilters(){
  const row = document.getElementById("filterRow");
  row.innerHTML = `<button class="filter-chip ${selectedBrand==="all"?"active":""}" type="button" data-brand="all">All Brands</button>` +
    brands.map(b => `<button class="filter-chip ${selectedBrand===b.name?"active":""}" type="button" data-brand="${b.name}">${b.name}</button>`).join("");
}
function renderProducts(){
  const grid = document.getElementById("productGrid");
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  const filtered = products.filter(p => {
    const matchesBrand = selectedBrand === "all" || p.brand === selectedBrand;
    const searchable = (p.name+" "+p.brand+" "+p.storage+" "+p.condition).toLowerCase();
    return matchesBrand && searchable.includes(search);
  });
  document.getElementById("phoneCount").textContent = filtered.length + (filtered.length===1?" phone":" phones");
  document.getElementById("productsHeading").textContent = selectedBrand==="all" ? "Our Smartphones" : selectedBrand+" Phones";
  if(!filtered.length){
    grid.innerHTML = `<div class="empty-message">No phones found for this brand/search.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <article class="product-card" data-id="${p.id}" tabindex="0" role="button" aria-label="View ${p.name} details">
      <div class="product-image">${imageMarkup(p)}</div>
      <div class="product-info">
        <h3>${p.name}</h3><div class="storage">${p.storage}</div>
        <div class="price">${formatPrice(p.price)}</div><div class="condition">${p.condition}</div>
        <button class="details-button" type="button">View Details →</button>
      </div>
    </article>`).join("");
}
function selectBrand(brand){
  selectedBrand = brand;
  document.getElementById("searchInput").value = "";
  renderFilters();
  renderProducts();
  document.getElementById("homePage").style.display = "block";
  document.getElementById("detailsPage").style.display = "none";
  document.getElementById("productsHeading").scrollIntoView({behavior:"smooth",block:"start"});
}
function showProduct(id,updateUrl=true){
  const p = products.find(item=>item.id===id);
  if(!p){showHome(false);return;}
  document.getElementById("homePage").style.display="none";
  document.getElementById("detailsPage").style.display="block";
  const message = `Hello MOBI MANIA! I am interested in ${p.name} (${p.storage}). Please confirm availability and final price.`;
  const whatsapp = "https://wa.me/"+SHOP_PHONE+"?text="+encodeURIComponent(message);
  document.getElementById("detailsContent").innerHTML = `
    <div class="details-layout">
      <div class="details-image">${imageMarkup(p)}</div>
      <div class="details-info">
        <div class="condition">${p.condition}</div><h1>${p.name}</h1>
        <p class="details-description">Available at MOBI MANIA, Madhyamgram.</p>
        <div class="price">${formatPrice(p.price)}</div><p class="muted">Brand: ${p.brand} · Storage: ${p.storage}</p>
        <h2 class="spec-heading">Specifications</h2>
        <ul class="spec-list">${p.specs.map(s=>`<li><span>${s[0]}</span><span>${s[1]}</span></li>`).join("")}</ul>
        <a class="buy-button" href="${whatsapp}" target="_blank" rel="noopener noreferrer">🟢 BUY NOW ON WHATSAPP</a>
        <p class="muted" style="margin-top:12px">Final price and availability will be confirmed by the shop.</p>
      </div>
    </div>`;
  if(updateUrl) history.pushState({productId:id},"","#product/"+id);
  window.scrollTo(0,0);
}
function showHome(updateUrl=true){
  document.getElementById("detailsPage").style.display="none";
  document.getElementById("homePage").style.display="block";
  if(updateUrl && location.hash.startsWith("#product/")) history.pushState({},"",location.pathname+location.search);
  renderFilters();renderProducts();window.scrollTo(0,0);
}
document.getElementById("brandGrid").addEventListener("click",e=>{
  const button=e.target.closest("[data-select-brand]");
  if(button) selectBrand(button.dataset.selectBrand);
});
document.getElementById("filterRow").addEventListener("click",e=>{
  const button=e.target.closest("[data-brand]");
  if(button) selectBrand(button.dataset.brand);
});
document.getElementById("productGrid").addEventListener("click",e=>{
  const card=e.target.closest("[data-id]");
  if(card) showProduct(card.dataset.id);
});
document.getElementById("productGrid").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-id]")){e.preventDefault();showProduct(e.target.dataset.id);}
});
document.getElementById("backButton").addEventListener("click",()=>showHome());
document.getElementById("searchInput").addEventListener("input",renderProducts);
window.addEventListener("popstate",()=>{
  const match=location.hash.match(/^#product\/(.+)$/);
  if(match) showProduct(match[1],false); else showHome(false);
});
