<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #080b14;
    --card: #121827;
    --border: #263147;
    --text: #f5f7ff;
    --muted: #aab4c8;
    --accent: #8b5cf6;
    --green: #25d366;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
}

button, input {
    font: inherit;
}

button, a {
    -webkit-tap-highlight-color: transparent;
}

header {
    background: #0d1220;
    border-bottom: 1px solid var(--border);
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #a78bfa;
}

.header-contact {
    color: var(--muted);
    font-size: 13px;
}

.hero {
    padding: 45px 5% 30px;
    text-align: center;
    background: radial-gradient(
        circle at top,
        #292052 0%,
        #111526 45%,
        #080b14 100%
    );
}

.hero h1 {
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.2;
    margin-bottom: 12px;
}

.hero h1 span {
    color: #a78bfa;
}

.hero p {
    color: var(--muted);
    margin-bottom: 22px;
}

.search-box {
    max-width: 550px;
    margin: auto;
}

.search-box input {
    width: 100%;
    padding: 15px 18px;
    border: 1px solid #39445d;
    background: #101626;
    border-radius: 12px;
    color: white;
    outline: none;
}

.search-box input:focus {
    border-color: var(--accent);
}

.section {
    max-width: 1200px;
    margin: auto;
    padding: 30px 5%;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
}

.section-heading h2 {
    font-size: 24px;
}

.muted {
    color: var(--muted);
    font-size: 13px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
}

.product-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
}

.product-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
}

.product-image {
    height: 180px;
    background: linear-gradient(145deg, #202944, #111625);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.image-placeholder {
    text-align: center;
    color: #c4b5fd;
    padding: 12px;
}

.image-placeholder .phone-icon {
    font-size: 43px;
    display: block;
    margin-bottom: 5px;
}

.image-placeholder small {
    color: var(--muted);
    display: block;
    font-size: 11px;
}

.product-info {
    padding: 15px;
}

.product-info h3 {
    font-size: 17px;
    margin-bottom: 5px;
}

.storage {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
}

.price {
    color: #c4b5fd;
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 10px;
}

.condition {
    display: inline-block;
    background: #252344;
    color: #d8ccff;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    margin-bottom: 12px;
}

.details-button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.details-button:hover {
    background: #7544e8;
}

.empty-message {
    text-align: center;
    color: var(--muted);
    padding: 35px 10px;
    grid-column: 1 / -1;
}

/* PRODUCT DETAILS PAGE */

#detailsPage {
    display: none;
    max-width: 1100px;
    margin: auto;
    padding: 25px 5% 50px;
}

.back-button {
    background: #20283a;
    color: white;
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 22px;
}

.details-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
}

.details-image {
    min-height: 340px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: linear-gradient(145deg, #202944, #111625);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;

    max-height: 400px;

}

.details-image .phone-icon {
    font-size: 85px;
    display: block;
}

.details-image .image-placeholder {
    font-size: 16px;
}

.details-info h1 {
    font-size: clamp(26px, 4vw, 36px);
    margin-bottom: 8px;
}

.details-info .price {
    font-size: 30px;
    margin: 12px 0;
}

.details-description {
    color: var(--muted);
    margin-bottom: 20px;
}

.spec-heading {
    font-size: 21px;
    margin: 25px 0 12px;
}

.spec-list {
    list-style: none;
}

.spec-list li {
    padding: 12px 14px;
    margin-bottom: 8px;
    background: #121827;
    border: 1px solid var(--border);
    border-radius: 9px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.spec-list li span:first-child {
    color: var(--muted);
}

.spec-list li span:last-child {
    text-align: right;
    overflow-wrap: anywhere;
}

.buy-button {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--green);
    color: #07150b;
    font-weight: 900;
    padding: 15px;
    border-radius: 11px;
    margin-top: 22px;
}

.buy-button:hover {
    background: #49e982;
}

footer {
    background: #0d1220;
    border-top: 1px solid var(--border);
    text-align: center;
    padding: 25px 15px;
    color: var(--muted);
    font-size: 13px;
}

footer strong {
    color: white;
}

@media (max-width: 900px) {
    .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));

@media (max-width: 650px) {
    header {
        padding: 15px 4%;

    .hero {

    .section {

    .product-grid {

    .product-image {

    .product-info {
        padding: 11px;

    .product-info h3 {

    }

    .price {

    .details-layout {

    .details-image {

    #detailsPage {
        padding: 20px 4% 35px;

}

@media (max-width: 360px) {
    .product-grid {
        grid-template-columns: 1fr;
    }

    .product-image {
        height: 200px;

}
</style>
</head>

/* PRICE FORMAT */

function formatPrice(price) {
    if (price === null || price === undefined) {
        return "Ask for Price";
    }

    return "₹" + price.toLocaleString("en-IN") + "/-";
}


/* IMAGE PLACEHOLDER */

function getImage(product, detail = false) {

    if (product.image) {
        return `
            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
            >
            <div class="image-placeholder" style="display:none">
                <span class="phone-icon">📱</span>
                Add Phone Photo Later
            </div>
        `;
    }

    return `
        <div class="image-placeholder">
            <span class="phone-icon">📱</span>
            <strong>${product.name}</strong>
            <small>Phone photo will be added soon</small>
        </div>
    `;
}


/* DISPLAY PRODUCT CARDS */

function renderProducts() {

    const grid = document.getElementById("productGrid");
    const search = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(search) ||
        product.storage.toLowerCase().includes(search)
    );

    document.getElementById("phoneCount").textContent =
        filtered.length + " phones";

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty-message">
                No phones found. Try another search.
            </div>
        `;
        return;
    }

    grid.innerHTML = filtered.map(product => `

        <article
            class="product-card"
            onclick="openProduct('${product.id}')"
        >

            <div class="product-image">
                ${getImage(product)}
            </div>

            <div class="product-info">

                <h3>${product.name}</h3>

                <div class="storage">
                    ${product.storage}
                </div>

                <div class="price">
                    ${formatPrice(product.price)}
                </div>

                <div class="condition">
                    ${product.condition}
                </div>

                    class="details-butto
