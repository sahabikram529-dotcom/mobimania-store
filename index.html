<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOBI MANIA | Premium Mobile Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0714;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #140b25;
      border-bottom: 1px solid #35204f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      color: #c084fc;
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 14px;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px;
      background: linear-gradient(135deg, #170b2d, #431477);
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #d8b4fe;
    }

    .hero p {
      color: #e9ddf8;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      background: #a855f7;
      color: white;
      padding: 13px 22px;
      border: none;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .section {
      padding: 35px 16px;
      max-width: 1100px;
      margin: auto;
    }

    .section h2 {
      margin-bottom: 22px;
      color: #d8b4fe;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
